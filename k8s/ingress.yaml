apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hardened-app
  namespace: hardened-app
spec:
  ingressClassName: nginx
  rules:
    - host: hardened-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hardened-app
                port:
                  number: 80
