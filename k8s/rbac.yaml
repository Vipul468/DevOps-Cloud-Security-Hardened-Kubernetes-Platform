apiVersion: v1
kind: ServiceAccount
metadata:
  name: hardened-app
  namespace: hardened-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hardened-app-readonly
  namespace: hardened-app
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hardened-app-readonly
  namespace: hardened-app
subjects:
  - kind: ServiceAccount
    name: hardened-app
    namespace: hardened-app
roleRef:
  kind: Role
  name: hardened-app-readonly
  apiGroup: rbac.authorization.k8s.io
