apiVersion: v1
kind: ServiceAccount
metadata:
  name: hardened-app
  namespace: hardened-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hardened-app-readonly
  namespace: hardened-app
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hardened-app-readonly
  namespace: hardened-app
subjects:
  - kind: ServiceAccount
    name: hardened-app
    namespace: hardened-app
roleRef:
  kind: Role
  name: hardened-app-readonly
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hardened-app-cluster-readonly
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hardened-app-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: hardened-app
    namespace: hardened-app
roleRef:
  kind: ClusterRole
  name: hardened-app-cluster-readonly
  apiGroup: rbac.authorization.k8s.io