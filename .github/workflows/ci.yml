name: Security Hardened Kubernetes Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Tests
        run: |
          pytest app/test_app.py -v


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t security-hardened-k8s-platform:${{ github.sha }} \
            .


  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t security-hardened-k8s-platform:${{ github.sha }} \
            .

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: security-hardened-k8s-platform:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
