apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-load
  namespace: hardened-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-load
  template:
    metadata:
      labels:
        app: memory-load
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory-load
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import time
              chunks = []
              for i in range(5):
                  chunks.append(bytearray(100 * 1024 * 1024))
              while True:
                  time.sleep(10)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "550Mi"
            limits:
              memory: "700Mi"