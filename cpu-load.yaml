apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load
  namespace: hardened-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: cpu-load
  template:
    metadata:
      labels:
        app: cpu-load
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cpu-load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                : $((123456789 * 987654321))
              done

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "500m"
            limits:
              cpu: "1000m"