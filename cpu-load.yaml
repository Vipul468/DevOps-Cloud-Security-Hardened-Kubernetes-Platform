apiVersion: v1
kind: Pod
metadata:
  name: cpu-load
  namespace: hardened-app
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: cpu-load
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do :; done"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault